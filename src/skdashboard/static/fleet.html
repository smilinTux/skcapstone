<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKDashboard: Fleet Drift</title>
  <link rel="stylesheet" href="/static/css/board.css">
  <link rel="stylesheet" href="/static/css/cockpit.css">
  <link rel="stylesheet" href="/static/css/fleet.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar sidebar" role="navigation" aria-label="Dashboard sections">
      <div class="brand"><div class="glyph">SK</div><h1>SKDashboard</h1></div>
      <div class="tabs">
        <a class="tab" data-nav="home" href="/">Overview</a>
        <a class="tab" data-nav="cockpit" href="/cockpit">ITIL Cockpit</a>
        <a class="tab" data-nav="cmdb" href="/cmdb">Assets (CMDB)</a>
        <a class="tab" data-nav="board" href="/board">Kanban Board</a>
        <a class="tab" data-nav="assistant" href="/assistant">Assistant</a>
        <a class="tab" data-nav="trust" href="/trust">Trust</a>
        <a class="tab" data-nav="models" href="/models">Models</a>
        <a class="tab" data-nav="economy" href="/economy">Economy</a>
        <a class="tab active" data-nav="fleet" href="/fleet">Fleet Drift</a>
      </div>
      <div class="spacer"></div>
      <span id="fl-errors" class="fl-err" hidden></span>
      <button class="btn" id="btn-refresh">Refresh</button>
    </div>

    <div class="kpirow" id="fl-kpi"></div>

    <div class="card" style="margin-top:14px">
      <h2>Graded nodes <span class="badge">observed inventory vs install profile</span></h2>
      <div class="cbody" id="fl-nodes"><div class="spinner"></div></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>Not graded <span class="badge">no verdict is possible, and that is not a clean bill</span></h2>
      <div class="cbody" id="fl-skipped"><div class="spinner"></div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="/static/js/fleet.js"></script>
</body>
</html>
