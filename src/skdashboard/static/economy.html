<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKDashboard — Economy</title>
  <link rel="stylesheet" href="/static/css/board.css">
  <link rel="stylesheet" href="/static/css/cockpit.css">
  <link rel="stylesheet" href="/static/css/economy.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar sidebar" role="navigation" aria-label="Dashboard sections">
      <div class="brand"><div class="glyph">SK</div><h1>SKDashboard</h1></div>
      <div class="tabs">
        <a class="tab" data-nav="home" href="/">Overview</a>
        <a class="tab" data-nav="cockpit" href="/cockpit">ITIL Cockpit</a>
        <a class="tab" data-nav="cmdb" href="/cmdb">Assets (CMDB)</a>
        <a class="tab" data-nav="board" href="/board">Kanban Board</a>
        <a class="tab" data-nav="assistant" href="/assistant">Assistant</a>
        <a class="tab" data-nav="trust" href="/trust">Trust</a>
        <a class="tab" data-nav="models" href="/models">Models</a>
        <a class="tab active" data-nav="economy" href="/economy">Economy</a>
      </div>
      <div class="spacer"></div>
      <span id="eco-errors" class="eco-err" hidden></span>
      <button class="btn" id="btn-refresh">Refresh</button>
    </div>

    <div class="kpirow" id="eco-kpi"></div>

    <div class="card" style="margin-top:14px">
      <h2>Cost over time <span class="badge">joules / day, last 30 days</span></h2>
      <div class="cbody" id="eco-chart"><div class="spinner"></div></div>
    </div>

    <div class="ov-grid" style="margin-top:14px">
      <div class="card">
        <h2>By repo <span class="badge">all-time, sorted by joules</span></h2>
        <div class="cbody" id="eco-by-repo"><div class="spinner"></div></div>
      </div>
      <div class="card">
        <h2>Agent wallets <span class="badge">fleet joule wealth</span></h2>
        <div class="cbody" id="eco-wallets"><div class="spinner"></div></div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>Recent settlements <span class="badge">last 20</span></h2>
      <div class="cbody" id="eco-settlements"><div class="spinner"></div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="/static/js/economy.js"></script>
</body>
</html>
