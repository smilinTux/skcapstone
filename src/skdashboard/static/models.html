<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKDashboard Models</title>
  <link rel="stylesheet" href="/static/css/board.css">
  <link rel="stylesheet" href="/static/css/cockpit.css">
  <style>
    #models-body { padding: 12px 16px; }
    .models-help { color: var(--muted, #9aa4b2); font-size: 13px; margin: 4px 0 12px; }
    .models-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .models-toolbar input[type=search] { flex: 1; min-width: 200px; padding: 7px 10px; border-radius: 8px;
      border: 1px solid var(--border, #2a3140); background: var(--surface, #10151f); color: inherit; }
    .model-row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-bottom: 1px solid var(--border, #222); }
    .model-row .id { font-weight: 600; }
    .model-row .prov { color: var(--muted, #9aa4b2); font-size: 12px; margin-left: 8px; }
    .badge-free { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px;
      background: #1f6f4a; color: #d7ffe9; margin-left: 8px; }
    .model-row .grow { flex: 1; }
    /* toggle */
    .sw { position: relative; width: 40px; height: 22px; }
    .sw input { opacity: 0; width: 0; height: 0; }
    .sw span { position: absolute; inset: 0; cursor: pointer; background: #3a4150; border-radius: 22px; transition: .15s; }
    .sw span:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .15s; }
    .sw input:checked + span { background: #7c5cff; }
    .sw input:checked + span:before { transform: translateX(18px); }
    .dirty-note { color: #ffb454; font-size: 12px; margin-left: 8px; }
    /* View toggle (Manage / Cards) */
    .view-toggle { display: inline-flex; border: 1px solid var(--border, #2a3140); border-radius: 8px; overflow: hidden; }
    .view-toggle button { background: transparent; border: 0; color: var(--muted, #9aa4b2); padding: 6px 12px; cursor: pointer; font: inherit; }
    .view-toggle button.on { background: #7c5cff; color: #fff; }
    /* Model dex cards */
    .dex-group { margin: 18px 0 6px; display: flex; align-items: baseline; gap: 10px; }
    .dex-group .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dex-group .t { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; }
    .dex-group .d { color: var(--muted, #9aa4b2); font-size: 12px; }
    .dot.local { background: #34d399; } .dot.free { background: #38bdf8; } .dot.cloud { background: #c084fc; }
    .dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .dex-card { background: var(--surface, #10151f); border: 1px solid var(--border, #2a3140); border-radius: 12px;
      padding: 13px 14px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
    .dex-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--border, #2a3140); }
    .dex-card.local::before { background: #34d399; } .dex-card.free::before { background: #38bdf8; } .dex-card.cloud::before { background: #c084fc; }
    .dex-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .dex-name { font-weight: 700; }
    .dex-org { color: var(--muted, #9aa4b2); font-size: 12px; margin-top: 2px; }
    .dex-badge { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
    .dex-badge.local { color: #34d399; border: 1px solid #34d399; } .dex-badge.free { color: #38bdf8; border: 1px solid #38bdf8; } .dex-badge.cloud { color: #c084fc; border: 1px solid #c084fc; }
    .dex-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .dex-chip { font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border, #2a3140); color: var(--muted, #9aa4b2); }
    .dex-chip.on { color: #7cf; border-color: #46618a; }
    .dex-summary { font-size: 12.5px; color: #c3ccd8; margin: 0; }
    .dex-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 12px; font-size: 12px; }
    .dex-stats .k { color: var(--muted, #9aa4b2); }
    .dex-stats .v { font-variant-numeric: tabular-nums; }
    .dex-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .dex-tag { font-size: 11px; color: var(--muted, #9aa4b2); border: 1px solid var(--border, #2a3140); border-radius: 20px; padding: 1px 9px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar sidebar" role="navigation" aria-label="Dashboard sections">
      <div class="brand"><div class="glyph">SK</div><h1>SKDashboard</h1></div>
      <div class="tabs">
        <a class="tab" data-nav="home" href="/control-plane/now">Now</a>
        <a class="tab" data-nav="portfolio" href="/control-plane/portfolio?role=project-manager&amp;scope=estate&amp;window=latest&amp;baseline=none&amp;service=all">Portfolio</a>
        <a class="tab" data-nav="schedule" href="/control-plane/schedule?role=project-manager&amp;scope=estate&amp;window=latest&amp;baseline=none&amp;service=all&amp;lens=roadmap&amp;timezone=UTC">Schedule</a>
        <a class="tab" data-nav="cockpit" href="/cockpit">ITIL Cockpit</a>
        <a class="tab" data-nav="cmdb" href="/cmdb">Assets (CMDB)</a>
        <a class="tab" data-nav="board" href="/board">Kanban Board</a>
        <a class="tab" data-nav="assistant" href="/assistant">Assistant</a>
        <a class="tab" data-nav="trust" href="/trust">Trust</a>
        <a class="tab active" data-nav="models" href="/models">Models</a>
        <a class="tab" data-nav="economy" href="/economy">Economy</a>
        <a class="tab" data-nav="fleet" href="/fleet">Fleet Drift</a>
      </div>
      <div class="spacer"></div>
      <div class="view-toggle" id="view-toggle">
        <button data-mode="manage" class="on" type="button">Manage</button>
        <button data-mode="cards" type="button">Cards</button>
      </div>
      <span id="dirty" class="dirty-note"></span>
      <button class="btn" id="btn-save">Save</button>
    </div>

    <div class="kpirow" id="models-kpi"></div>
    <div id="models-body"><div class="emptymsg">Loading models…</div></div>
  </div>
  <div class="toast" id="toast"></div>

  <script type="module">
    const body = document.getElementById('models-body');
    const kpi = document.getElementById('models-kpi');
    const dirtyEl = document.getElementById('dirty');
    const saveBtn = document.getElementById('btn-save');
    const toast = document.getElementById('toast');

    // Prefix-aware API base: works standalone (page at /models -> API '') AND
    // embedded under the skchat shell proxy (page at /skdashboard/models -> API
    // '/skdashboard', so fetches hit /skdashboard/api/... and reach the dashboard
    // through the reverse proxy instead of escaping the prefix).
    const API = location.pathname.replace(/\/models\/?$/, '');

    // The operator identity + capability token this page presents on the
    // gated save below (Unified Consent Plane P1.3, coord card a638b490).
    // Fetched once from GET /api/auth/capability, which today hands the
    // value back on loopback trust alone - see its docstring in
    // dashboard.py. Degrades to {actor: 'unattributed', capability: null}
    // on any failure, never the hardcoded 'operator' this card retires.
    let capPromise = null;
    async function authHeaders(extra) {
      if (!capPromise) {
        capPromise = fetch(API + '/api/auth/capability', { headers: { Accept: 'application/json' } })
          .then((r) => (r.ok ? r.json() : {}))
          .catch(() => ({}));
      }
      const cap = await capPromise;
      const headers = { 'X-SK-Actor': cap.actor || 'unattributed', ...(extra || {}) };
      if (cap.capability) headers['X-SK-Capability'] = cap.capability;
      return headers;
    }

    let models = [];              // [{id, provider, free, advertised}]
    const enabled = new Set();    // ids currently enabled (mutable, local)
    let query = '';
    let freeOnly = false;
    let dirty = false;
    let mode = 'manage';          // 'manage' (enable/disable) | 'cards' (dex)

    const TIERS = [
      { key: 'local', label: 'Sovereign', desc: 'Self-hosted on our own GPUs. Cloud-free.' },
      { key: 'free-remote', label: 'Free remote', desc: 'Free-tier hosted models.' },
      { key: 'paid-cloud', label: 'Paid cloud', desc: 'Metered API. Used deliberately.' },
    ];
    const TIER_CLS = { 'local': 'local', 'free-remote': 'free', 'paid-cloud': 'cloud' };

    function fmtTok(n) {
      if (typeof n !== 'number') return 'n/a';
      if (n >= 1e6) return (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'M';
      if (n >= 1e3) return Math.round(n / 1e3) + 'K';
      return String(n);
    }

    function showToast(msg) {
      toast.textContent = msg; toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function markDirty(v) { dirty = v; dirtyEl.textContent = v ? 'unsaved changes' : ''; }

    async function load() {
      body.innerHTML = '<div class="emptymsg">Loading models…</div>';
      try {
        const r = await fetch(API + '/api/models');
        const d = await r.json();
        models = (d.data || []).slice();
        enabled.clear();
        for (const m of models) if (m.advertised) enabled.add(m.id);
        markDirty(false);
        render();
      } catch (e) {
        body.innerHTML = '<div class="emptymsg">Could not reach the gateway admin API.</div>';
      }
    }

    function visible() {
      const q = query.trim().toLowerCase();
      return models.filter(m => {
        if (freeOnly && m.free !== true) return false;
        if (!q) return true;
        return (m.id || '').toLowerCase().includes(q) || (m.provider || '').toLowerCase().includes(q);
      });
    }

    function renderCards() {
      saveBtn.style.display = 'none';
      const vis = visible().filter(m => m.card);   // only carded models in the dex
      const counts = { 'local': 0, 'free-remote': 0, 'paid-cloud': 0 };
      for (const m of vis) { const t = m.card.tier; if (t in counts) counts[t]++; }
      kpi.innerHTML =
        `<div class="kpi"><div class="k">${vis.length}</div><div class="l">carded</div></div>` +
        `<div class="kpi"><div class="k">${counts['local']}</div><div class="l">sovereign</div></div>` +
        `<div class="kpi"><div class="k">${counts['free-remote']}</div><div class="l">free</div></div>` +
        `<div class="kpi"><div class="k">${counts['paid-cloud']}</div><div class="l">cloud</div></div>`;

      let html = `<div class="models-toolbar">
        <input type="search" id="q" placeholder="Search models, orgs, capabilities" value="${escapeAttr(query)}"></div>`;
      for (const t of TIERS) {
        const group = vis.filter(m => (m.card.tier || 'free-remote') === t.key);
        if (!group.length) continue;
        const cls = TIER_CLS[t.key];
        html += `<div class="dex-group"><span class="dot ${cls}"></span><span class="t">${t.label} &middot; ${group.length}</span><span class="d">${t.desc}</span></div>`;
        html += `<div class="dex-grid">` + group.map(cardHTML).join('') + `</div>`;
      }
      body.innerHTML = html || '<div class="emptymsg">No carded models match.</div>';
      document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
    }

    function cardHTML(m) {
      const c = m.card || {};
      const cls = TIER_CLS[c.tier] || 'free';
      const sp = Array.isArray(c.supported_parameters) ? c.supported_parameters : [];
      const tools = sp.includes('tools');
      const vision = typeof c.modality === 'string' && c.modality.includes('image');
      const chip = (label, on) => `<span class="dex-chip${on ? ' on' : ''}">${on ? '✓ ' : '✕ '}${label}</span>`;
      const stat = (k, v) => `<div><span class="k">${k}:</span> <span class="v">${escapeHtml(String(v))}</span></div>`;
      const params = c.params || c.size || 'n/a';
      const stats =
        stat('context', fmtTok(c.context_length)) +
        stat('max out', fmtTok(c.max_output_tokens)) +
        stat('params', params) +
        stat('quant', c.quant || 'n/a') +
        (c.speed ? stat('speed', c.speed) : '') +
        (c.license ? stat('license', c.license) : '');
      const tags = (c.good_at || []).map(g => `<span class="dex-tag">${escapeHtml(g)}</span>`).join('');
      const label = (c.tier === 'local' ? 'Sovereign' : c.tier === 'paid-cloud' ? 'Paid cloud' : 'Free remote');
      return `<div class="dex-card ${cls}">
        <div class="dex-top">
          <div><div class="dex-name">${escapeHtml(c.display_name || m.id)}</div>
            <div class="dex-org">${escapeHtml(c.org || m.provider || '')} &middot; ${escapeHtml(m.id)}</div></div>
          <span class="dex-badge ${cls}">${label}</span>
        </div>
        <div class="dex-chips">${chip('tools', tools)}${chip('vision', vision)}</div>
        ${c.summary ? `<p class="dex-summary">${escapeHtml(c.summary)}</p>` : ''}
        <div class="dex-stats">${stats}</div>
        ${tags ? `<div class="dex-tags">${tags}</div>` : ''}
      </div>`;
    }

    function render() {
      if (mode === 'cards') return renderCards();
      saveBtn.style.display = '';
      const vis = visible();
      kpi.innerHTML =
        `<div class="kpi"><div class="k">${models.length}</div><div class="l">discovered</div></div>` +
        `<div class="kpi"><div class="k">${enabled.size}</div><div class="l">enabled</div></div>`;
      const rows = vis.map(m => {
        const on = enabled.has(m.id) ? 'checked' : '';
        const free = m.free === true ? '<span class="badge-free">FREE</span>' : '';
        return `<div class="model-row">
          <div class="grow"><span class="id">${escapeHtml(m.id)}</span>
            <span class="prov">${escapeHtml(m.provider || '')}</span>${free}</div>
          <label class="sw"><input type="checkbox" data-id="${escapeAttr(m.id)}" ${on}><span></span></label>
        </div>`;
      }).join('');
      const controls = `<div class="models-help">Enabled models are advertised on the gateway (<code>/v1/models</code>)
        and offered in the reply-model picker and to the brain, everywhere. This is the same allowlist the
        skchat app "Manage models" screen writes.</div>
        <div class="models-toolbar">
          <input type="search" id="q" placeholder="Filter by id or provider" value="${escapeAttr(query)}">
          <label><input type="checkbox" id="freeonly" ${freeOnly ? 'checked' : ''}> Free only</label>
          <button class="btn" id="enable-all">Enable all shown</button>
          <button class="btn" id="disable-all">Disable all shown</button>
        </div>`;
      body.innerHTML = controls + (rows || '<div class="emptymsg">No models match.</div>');

      document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
      document.getElementById('freeonly').addEventListener('change', e => { freeOnly = e.target.checked; render(); });
      document.getElementById('enable-all').addEventListener('click', () => { for (const m of visible()) enabled.add(m.id); markDirty(true); render(); });
      document.getElementById('disable-all').addEventListener('click', () => { for (const m of visible()) enabled.delete(m.id); markDirty(true); render(); });
      body.querySelectorAll('input[type=checkbox][data-id]').forEach(cb => {
        cb.addEventListener('change', () => {
          if (cb.checked) enabled.add(cb.dataset.id); else enabled.delete(cb.dataset.id);
          markDirty(true); render();
        });
      });
    }

    async function save() {
      // If everything is enabled, persist [] (advertise-all) so future models auto-include.
      const enableAll = models.length > 0 && models.every(m => enabled.has(m.id));
      const payload = enableAll ? [] : Array.from(enabled);
      saveBtn.disabled = true;
      try {
        const r = await fetch(API + '/api/models/advertise', {
          method: 'POST', headers: await authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ enabled: payload }),
        });
        if (!r.ok) throw new Error('save failed');
        showToast(`Saved: ${enabled.size} model${enabled.size === 1 ? '' : 's'} enabled`);
        markDirty(false);
        await load();
      } catch (e) {
        showToast('Could not save (gateway offline)');
      } finally {
        saveBtn.disabled = false;
      }
    }

    function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
    function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

    saveBtn.addEventListener('click', save);
    document.getElementById('view-toggle').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-mode]');
      if (!b || b.dataset.mode === mode) return;
      mode = b.dataset.mode;
      document.querySelectorAll('#view-toggle button').forEach(x => x.classList.toggle('on', x.dataset.mode === mode));
      render();
    });
    load();
  </script>
</body>
</html>
