<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKDashboard — CMDB</title>
  <link rel="stylesheet" href="/static/css/board.css">
  <link rel="stylesheet" href="/static/css/cockpit.css">
  <link rel="stylesheet" href="/static/css/cmdb.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar sidebar" role="navigation" aria-label="Dashboard sections">
      <div class="brand"><div class="glyph">SK</div><h1>SKDashboard</h1></div>
      <div class="tabs">
        <a class="tab" data-nav="home" href="/">Status</a>
        <a class="tab" data-nav="cockpit" href="/cockpit">ITIL Cockpit</a>
        <a class="tab active" data-nav="cmdb" href="/cmdb">Assets (CMDB)</a>
        <a class="tab" data-nav="board" href="/board">Kanban Board</a>
        <a class="tab" data-nav="assistant" href="/assistant">Assistant</a>
        <a class="tab" data-nav="trust" href="/trust">Trust</a>
        <a class="tab" data-nav="models" href="/models">Models</a>
        <a class="tab" data-nav="economy" href="/economy">Economy</a>
        <a class="tab" data-nav="fleet" href="/fleet">Fleet Drift</a>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="btn-plan">Plan discovery</button>
      <button class="btn" id="btn-apply">Apply local discovery</button>
    </div>

    <div class="kpirow" id="cmdb-health"></div>
    <form class="cmdb-search" id="cmdb-search" role="search">
      <label for="cmdb-query">Search configuration items</label>
      <div class="cmdb-search-row">
        <input id="cmdb-query" name="q" type="search" maxlength="200"
          placeholder="Name, ID, type, node, tag, or attribute" autocomplete="off">
        <button class="btn" type="submit">Search</button>
        <button class="btn" id="cmdb-clear" type="button">Clear</button>
      </div>
      <div class="cmdb-filters" aria-label="CMDB filters">
        <select name="type" aria-label="CI type"><option value="">All types</option><option>service</option><option>host</option><option>agent</option><option>port</option><option>datastore</option><option>network</option><option>device</option></select>
        <input name="node" maxlength="100" placeholder="Node" aria-label="Node">
        <select name="status" aria-label="CI status"><option value="">All statuses</option><option>operational</option><option>degraded</option><option>down</option><option>retired</option></select>
        <input name="owner" maxlength="100" placeholder="Owner" aria-label="Owner">
        <input name="tag" maxlength="100" placeholder="Tag" aria-label="Tag">
        <select name="staleness" aria-label="Evidence freshness"><option value="">Any freshness</option><option>fresh</option><option>stale</option><option>unknown</option></select>
        <input name="source" maxlength="100" placeholder="Source" aria-label="Source">
      </div>
    </form>
    <section id="cmdb-coverage" class="cmdb-coverage" aria-label="Reconciliation coverage"></section>
    <div id="cmdb-action-state" class="cmdb-action-state" aria-live="polite"></div>
    <div id="cmdb-body"><div class="emptymsg">Loading CMDB…</div></div>
  </div>

  <div class="overlay" id="overlay"></div>
  <aside class="panel" id="panel" aria-hidden="true"></aside>
  <div class="toast" id="toast"></div>

  <script type="module" src="/static/js/cmdb.js"></script>
</body>
</html>
