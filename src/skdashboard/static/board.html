<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKDashboard — Board</title>
  <link rel="stylesheet" href="/static/css/board.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar sidebar" role="navigation" aria-label="Dashboard sections">
      <div class="brand"><div class="glyph">SK</div><h1>SKDashboard</h1></div>
      <div class="tabs">
        <a class="tab" data-nav="home" href="/control-plane/now">Now</a>
        <a class="tab" data-nav="portfolio" href="/control-plane/portfolio?role=project-manager&amp;scope=estate&amp;window=latest&amp;baseline=none&amp;service=all">Portfolio</a>
        <a class="tab" data-nav="schedule" href="/control-plane/schedule?role=project-manager&amp;scope=estate&amp;window=latest&amp;baseline=none&amp;service=all&amp;lens=roadmap&amp;timezone=UTC">Schedule</a>
        <a class="tab" data-nav="cockpit" href="/cockpit">ITIL Cockpit</a>
        <a class="tab" data-nav="cmdb" href="/cmdb">Assets (CMDB)</a>
        <a class="tab active" data-nav="board" href="/board">Kanban Board</a>
        <a class="tab" data-nav="assistant" href="/assistant">Assistant</a>
        <a class="tab" data-nav="trust" href="/trust">Trust</a>
        <a class="tab" data-nav="models" href="/models">Models</a>
        <a class="tab" data-nav="economy" href="/economy">Economy</a>
        <a class="tab" data-nav="fleet" href="/fleet">Fleet Drift</a>
      </div>
      <div class="spacer"></div>
      <span class="live"><span class="dot" id="live-dot"></span><span id="live-text">connecting</span></span>
      <span class="who mono" id="who">operator</span>
    </div>

    <div class="filters">
      <span class="fl" aria-hidden="true">filter</span>
      <label class="sr-only" for="f-text">Filter cards by title or ID</label>
      <input type="search" id="f-text" placeholder="title / id…" autocomplete="off">
      <label class="sr-only" for="f-owner">Filter cards by owner</label>
      <select id="f-owner"><option value="">any owner</option></select>
      <label class="sr-only" for="f-kind">Filter cards by kind</label>
      <select id="f-kind">
        <option value="">any kind</option>
        <option value="task">task</option>
        <option value="epic">epic</option>
        <option value="incident">incident</option>
        <option value="problem">problem</option>
        <option value="change">change</option>
      </select>
      <label class="sr-only" for="f-priority">Filter cards by priority</label>
      <select id="f-priority">
        <option value="">any priority</option>
        <option value="critical">critical</option>
        <option value="high">high</option>
        <option value="medium">medium</option>
        <option value="low">low</option>
      </select>
      <span class="spacer"></span>
      <button class="btn" id="btn-refresh">Refresh</button>
    </div>

    <div class="board-scroll"><div class="board" id="board"><div class="emptymsg">Loading board…</div></div></div>
  </div>

  <div class="overlay" id="overlay"></div>
  <aside class="panel" id="panel" aria-hidden="true"></aside>
  <div class="toast" id="toast"></div>

  <script src="/static/vendor/Sortable.min.js"></script>
  <script type="module" src="/static/js/board.js"></script>
</body>
</html>
