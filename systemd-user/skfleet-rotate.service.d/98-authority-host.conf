# AUTHORITY_HOST decides which single host may run close_reviewed_parents()
# and release_finished_review_claims(). It defaults to chiap08
# (skfleet-rotate.py:145), no estate record declares one, and chiap08 has its
# skfleet-rotate.timer DISABLED and has never run it. So both functions have
# never executed anywhere, which is why cards carrying a PASS verdict are
# never closed and finished review claims are never released.
#
# Pointed at chiap01, which does run the rotation. Set identically on every
# rotate host so exactly ONE satisfies HOST == AUTHORITY_HOST: the docstring
# is explicit that letting several publish is N-way contention over identical
# bytes on a Syncthing folder, which produces conflict copies rather than
# content.
[Service]
Environment=SKFLEET_AUTHORITY_HOST=chiap01
