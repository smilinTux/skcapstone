# Phase 2 of the claim-TTL rollout: REPORT ONLY. The reaper logs what it
# would reclaim as CLAIM_TTL_WOULD_RECLAIM and releases nothing. The gate on
# enforcement is that this list contains no worker that is actually alive.
#
# off returns before importing anything, so a host carrying a newer script
# with an older package cannot fail mid-cycle.
[Service]
Environment=SKFLEET_CLAIM_TTL_MODE=report
Environment=SKFLEET_CLAIM_TTL_H=48
