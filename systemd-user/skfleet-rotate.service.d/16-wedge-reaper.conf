# 16-wedge-reaper.conf
#
# 2026-09-19, Chef observed workers alive for 2 and 5 hours and asked whether
# that was a problem. Measured: 5 of 6 long-running workers had written NOTHING
# to their workspace for 111 to 276 minutes while each burned 2-4% CPU.
# One (a728f287) was silent for its entire 139 minute life. Only 1960b107 was
# genuinely working (workspace touched 2 minutes prior).
#
# REPORT mode only. This measures and logs; it does NOT stop any worker or
# release any claim. Move to `enforce` only after a clean report cycle has been
# reviewed, per PR #799's own rollout guidance.
#
# Threshold is 14400s (4h), chosen in PR #799 from a measured bimodal gap:
# progress-fresh topped out at 225s, the lowest progress-stale ever seen was
# 53,545s, and nothing landed in between. Replayed over 158 records it would
# have killed zero genuinely-working workers.
#
# NOTE for whoever reviews the report output: today's wedges cluster at 111-139
# minutes (6,660-8,340s), which sits INSIDE the gap that the original sample
# showed as empty. Either the failure distribution has changed or this is a new
# mode. Do NOT lower the threshold on this single observation; gather report-mode
# data first and re-derive it the way #799 did.
[Service]
Environment=SKFLEET_WEDGE_MODE=report
