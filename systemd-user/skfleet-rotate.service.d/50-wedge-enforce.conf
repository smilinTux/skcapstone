# Arm the wedge actuator. Operator decision, 2026-09-21.
#
# _wedge_mode() defaults to "" (off): no scan is acted on until asked. It is
# asked now, because two workers each held a codex slot for 9.5 hours while
# every signal reported them healthy (fresh heartbeat, fresh transcript mtime,
# state=progress-fresh) and both had to be found and killed by hand.
#
# What this turns on is fenced, not blunt. Only three states actuate:
#   wedge-stale-confirmed      transcript frozen past the deadline
#   wedge-absent-confirmed     workspace gone, with a local admission receipt
#   wedge-transcript-runaway   transcript over 100MB (new)
# and each kill re-reads the claim generation, re-evaluates the fence against
# it, stops the unit before recording, and refuses to release without a durable
# reason.
#
# Replay evidence before arming: test_no_genuinely_working_worker_would_have_
# been_killed runs 158 real WORKER_PROGRESS records from this fleet and passes.
#
# Rollback: delete this drop-in and reload the user manager. Setting
# SKFLEET_WEDGE_MODE=report keeps the scan and its logging with no kills.
[Service]
Environment=SKFLEET_WEDGE_MODE=enforce
