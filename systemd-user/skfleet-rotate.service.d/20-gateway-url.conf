# The dispatcher requires SKFLEET_GATEWAY_URL and exits without it, which is
# why rotate could never run on this host. Set to the gateway ORIGIN with no
# path: /health and /queue are served at the root and only chat completions
# live under /v1. A /v1 suffix here cost the fleet three days of zero
# dispatch on 2026-09-18.
[Service]
Environment=SKFLEET_GATEWAY_URL=http://chiap01:18790
