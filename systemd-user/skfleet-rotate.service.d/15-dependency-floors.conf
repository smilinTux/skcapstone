# Advisory dependency-floor check before every rotation cycle.
#
# 2026-09-19: a deploy advanced ~/work/skcapstone to a commit importing
# skcoord.coordination.TaskUnclaimable (skcoord >= 0.1.78) while every chi host
# still had skcoord 0.1.77 installed, because the deploy ran git pull and copied
# the dispatcher but skipped pip install -e .. skfleet-rotate.py imports
# builder_dispatch at line 41, so the ENTIRE rotation died on all five hosts,
# every lane, from 05:33 UTC. It ran unnoticed for about an hour.
#
# pyproject.toml already declared skcoord>=0.1.78. Nothing compared the declared
# floor against what was installed: doctor only checks PyPI-latest, and preflight
# only checks importability (0.1.77 imported fine).
#
# The "-" prefix makes this ADVISORY on purpose. The skcoord floor is sometimes
# deliberately set one past the newest published tag, so a hard gate here would
# convert an intended publish window into a fleet-wide outage on every bump.
# This only has to make the cause greppable in journald instead of an ImportError
# five minutes later with no explanation.
[Service]
ExecStartPre=-%h/.skenv/bin/skcapstone preflight
