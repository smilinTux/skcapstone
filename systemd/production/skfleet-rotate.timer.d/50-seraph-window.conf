# chiap08 is the only host that runs Seraph, and both dispatchers take the SAME
# lock (~/.skcapstone/fleet/rotate.lock). Each cycle runs about 2.5 to 3 minutes
# wall clock, so the shipped cadence (rotate :03,:08,... and seraph :01,:06,...,
# two minutes apart) guarantees they overlap. Rotate waits up to 240s for the
# lock; Seraph waits only SERAPH_LOCK_WAIT_SECONDS = 75, so Seraph is the one
# that loses and reports NOOP_RECEIPT|reason=rotation_overlap.
#
# Ten-minute cadence, five minutes apart, gives each dispatcher a clean window
# roughly twice the length of a run. Halving rotate frequency on this one host
# costs little: the ready pool is small and a cycle launches up to MAX_LAUNCH
# either way, while the review lane it makes room for is what actually grows
# that pool. Only chiap08 is changed; the other four hosts keep their cadence.
[Timer]
OnCalendar=
OnCalendar=*-*-* *:00,10,20,30,40,50:00
