# The rotation is Type=oneshot. With the default KillMode=control-group, systemd
# tears down the entire cgroup the moment the script returns, which killed every
# tmux worker it had just launched, seconds after launching it. The same cards
# were then relaunched every five minutes forever, producing 0-byte and 84-byte
# worker logs and zero completed work.
#
# chiap08 was the only host completing cards, purely because it happened to have
# a tmux server started by hand outside the service cgroup. That accident was
# doing the work this setting should have been doing.
#
# KillMode=process terminates only the main python process and leaves the
# detached workers running, which is the intended lifecycle for an ephemeral
# fire-and-forget launcher.
[Service]
KillMode=process
