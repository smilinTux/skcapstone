[Service]
Environment=SKFLEET_LINK_REPOSITORIES=smilinTux/skcapstone,smilinTux/skdashboard,smilinTux/skworld,smilinTux/sk-standards,https://skgit.skstack01.douno.it/smilinTux/sklegal
ExecStart=
ExecStart=/bin/sh -ec 'IFS= read -r SKFLEET_SKGIT_READ_TOKEN < %h/.config/skgit/token || test -n "$${SKFLEET_SKGIT_READ_TOKEN}"; export SKFLEET_SKGIT_READ_TOKEN; exec %h/.skenv/bin/python3 %h/.skenv/bin/skfleet-link-producer.py'
