name: docs-check
on:
  # Was `on: [push, pull_request]`, which fires on every branch and so
  # ran twice per PR (the duplicate `docs / docs-check` rows). Scoped to
  # main to match ci.yml and providers.yml.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # merge_group: prerequisite for a GitHub merge queue (not yet enabled -
  # that switch is a separate, deliberate step; see this PR's description).
  # NOTE: the reusable workflow this job calls had a latent bug under
  # merge_group - its changed-files step read github.base_ref, which is only
  # populated for pull_request, so tier 2 silently passed unconditionally
  # under merge_group regardless of what changed. Fixed upstream in
  # sk-standards#62 (https://github.com/smilinTux/sk-standards/pull/62).
  # That fix is NOT yet reflected in this file's pin - see the PR
  # description for what still needs to land before merge_group runs here
  # are trustworthy.
  merge_group:
permissions:
  contents: read
jobs:
  docs:
    uses: smilinTux/sk-standards/.github/workflows/docs-check.yml@ffa53c20d7e8 # sk-standards main incl #61 (changelog.d fragment) and #62 (merge_group tier-2 fix)
    with:
      tiers: "1,2,3"
      # BOTH refs must name a commit REACHABLE FROM sk-standards main.
      # 155071f7 (the previous value of both) was PR #61's HEAD commit on
      # `feat/changelog-fragment-tier2`. #61 was squash-merged, so main got a
      # DIFFERENT sha and the branch was deleted, leaving 155071f7 reachable
      # from nothing. `uses:` could not resolve it, so the workflow failed
      # BEFORE creating any job -- conclusion=failure with
      # latest_check_runs_count=0. That produces NO `docs / docs-check` check
      # run at all, so the gate did not go red, it went ABSENT: `gh pr checks`
      # simply stopped listing it, and every merge to main from 08:46Z onward
      # ran with no docs enforcement of any kind, tier 3 included.
      #
      # A required check that stops reporting is indistinguishable from one
      # that was never configured. Verify a repin with
      # `gh api repos/smilinTux/sk-standards/compare/main...<sha> --jq .status`
      # -- it must say "identical" or "behind", never "diverged".
      #
      # NOTE: the `uses:@SHA` pin above only freezes which version of THIS
      # workflow's orchestration (steps/inputs) runs. The actual validator
      # (scripts/docs_check.py) is fetched separately by that workflow from
      # sk-standards at `standards-ref`, which defaults to the FLOATING
      # `main` branch. Without this explicit standards-ref, skcapstone's
      # tier-2/3 behavior silently follows sk-standards main regardless of
      # the SHA pin above - discovered because bumping the SHA pin alone did
      # NOT make the changelog.d/ fragment widening take effect in CI (see
      # PR description). Pinning both makes the gate's actual rules
      # reproducible from this file alone.
      standards-ref: "ffa53c20d7e8"
