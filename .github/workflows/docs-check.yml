name: docs-check
on:
  # Was `on: [push, pull_request]`, which fires on every branch and so
  # ran twice per PR (the duplicate `docs / docs-check` rows). Scoped to
  # main to match ci.yml and providers.yml.
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  docs:
    uses: smilinTux/sk-standards/.github/workflows/docs-check.yml@e8d352e1a4c136643106de36c0880310d9fb1ed6 # main
    with:
      tiers: "1,2,3"
