name: skmemory pin moves

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pin-moves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install packaging
      - run: python scripts/ci/check_skmemory_pin_moves.py "origin/${{ github.base_ref }}"
