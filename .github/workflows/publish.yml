name: Publish to PyPI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Trusted Publishing (OIDC): configure a PyPI pending publisher for this project:
#   owner=smilinTux  workflow=publish.yml  environment=pypi
# No PyPI token is used. A tagged release only needs to build + pass twine check.
concurrency:
  # Never let two release gates race: a later CI completion waits rather than
  # computing the same "next" tag from a stale view of the tag list.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------- #
  # Cut the release tag only after CI succeeds for the current main commit.
  # ---------------------------------------------------------------------- #
  tag:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tagged: ${{ steps.bump.outputs.tagged }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags, or `git describe` cannot see the latest tag and
          # every run would compute v0.0.1.
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: bump
        name: Cut the next patch tag if current main is not already tagged
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          target_sha="${{ github.event.workflow_run.head_sha }}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$target_sha" != "$current_main" ]; then
            echo "CI succeeded for a superseded main commit; nothing to release."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$target_sha" ]; then
            echo "::error::checked out commit does not match the successful CI commit"
            exit 1
          fi

          # Use the HIGHEST v-tag in the repo, not `git describe`.
          #
          # describe only sees tags that are ANCESTORS of HEAD, so an unpushed,
          # orphaned or rename-stranded tag makes it report "previous: none" and
          # restart the sequence from zero. That published skcoord/skdashboard
          # 0.0.1 and then 0.0.2, both BELOW the existing 0.1.0. A release must
          # never be able to go backwards, so rank all tags by version instead.
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
          # Any release tag AT HEAD means nothing new to ship, even if it is
          # not the highest one (ranking means the highest may sit elsewhere).
          if [ -n "$(git tag --points-at HEAD -l 'v[0-9]*.[0-9]*.[0-9]*')" ]; then
            echo "HEAD is already tagged; nothing to release."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${latest:-v0.0.0}"
          ver="${base#v}"
          IFS='.' read -r major minor patch <<< "$ver"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          next="v${major}.${minor}.$((patch + 1))"
          while git rev-parse -q --verify "refs/tags/$next" >/dev/null 2>&1; do
            patch=$((patch + 1))
            next="v${major}.${minor}.$((patch + 1))"
          done

          # PyPI rejects direct URL requirements even though build and
          # `twine check` accept them. Refuse them before creating an immutable
          # release tag. Exact qualification pins belong in the separate
          # operator constraints file, not public package metadata.
          python - <<'PY'
          from pathlib import Path

          lines = Path("pyproject.toml").read_text(encoding="utf-8").splitlines()
          direct = [line.strip().rstrip(",") for line in lines if line.lstrip().startswith('"') and " @ " in line]
          if direct:
              raise SystemExit("::error::PyPI rejects direct URL requirements: " + ", ".join(direct))
          PY

          echo "Cutting $next at ${head_sha:0:8} (previous: ${latest:-none})"
          git tag -a "$next" -m "release: $next from main"
          git push origin "$next"
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: [tag]
    if: needs.tag.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from this tag. Full history must
          # be visible here or the build would produce a
          # dev version with a local segment (+g<sha>), which PyPI rejects.
          fetch-depth: 0
          fetch-tags: true
          ref: v${{ needs.tag.outputs.version }}
      - name: Refuse to publish a tag that is not on main
        # The local pre-push hook is a symlink into each clone's working tree, so
        # a clone that has not pulled the main-only fix keeps cutting tags at
        # feature-branch tips and pushing them. This is the server-side backstop:
        # it holds no matter what any developer's clone does.
        #
        run: |
          set -euo pipefail
          release_tag="v${{ needs.tag.outputs.version }}"
          release_sha="$(git rev-list -n 1 "$release_tag")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$release_sha" refs/remotes/origin/main; then
            echo "OK: $release_tag (${release_sha:0:8}) is on main."
            exit 0
          fi
          echo "::error::$release_tag points at ${release_sha:0:8}, which is NOT on main. Refusing to publish."
          echo "::error::Preserve the unpublished tag as evidence, merge the change, and let successful main CI cut the next release."
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert the version to publish is a real release
        # A dev/local version (.devN, +g<sha>, 0.0.0) is rejected by PyPI with a
        # 400, and by then the tag has already been cut. Fail here instead.
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade setuptools_scm >/dev/null
          v="$(python -m setuptools_scm 2>/dev/null || echo unknown)"
          echo "version to publish: $v"
          case "$v" in
            *+*|*dev*|unknown|0.0.0*)
              echo "::error::refusing to publish a non-release version: $v"
              exit 1 ;;
          esac
      - run: python -m pip install --upgrade build twine
      - run: python -m build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.tag.outputs.version }}
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    # Publish only the artifact built by the successful main-CI release run.
    if: >-
      always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
