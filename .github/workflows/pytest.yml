name: pytest

# Honest hermetic unit-test CI for skcapstone.
#
# - Installs the package with ALL optional sovereign extras + dev tools so the
#   full test tree imports cleanly (capauth, sksecurity, skmemory[skvector],
#   skseed, skwhisper, skchat-sovereign, skcomms, fusepy, cloud SDKs).
#   See [project.optional-dependencies] in pyproject.toml.
# - Runs pytest on Python 3.11 and 3.12 (the supported runtime floor per
#   CLAUDE.md: "Python 3.11+").
# - Excludes non-hermetic tests HONESTLY via pytest markers (registered in
#   [tool.pytest.ini_options]) using `-m "not integration and not e2e and not
#   network"` plus `--strict-markers`. These tests need real services, network
#   stack, sockets, or an installed CLI / running daemon and cannot run on a
#   clean runner. Nothing here is masked with `|| true` — a real failure fails
#   the job.

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # libfuse is needed for the fusepy optional extra (FUSE mount tests).
      - name: Install system deps (libfuse)
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev

      - name: Install package with all extras + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      # This check runs before any Git source reinstall so a sibling checkout
      # cannot hide a stale registry artifact. SKCapstone release candidates
      # require the published skcoord lifecycle and criteria-fold contract.
      #
      # KEEP THIS VERSION EQUAL TO THE skcoord FLOOR IN pyproject.toml.
      # tests/test_coord_amend.py runs TWICE in this job: once here against the
      # pinned registry wheel, and again at the end against skcoord from git
      # main. If those two versions implement different contracts, no assertion
      # in that file can satisfy both and the job is unwinnable.
      #
      # That is not hypothetical. This pin sat at 0.1.44 while skcoord released
      # through 0.1.53, going nine releases stale. On 2026-08-27 skcoord 0.1.51
      # changed KanbanBoard.cards() from failing closed on malformed criteria to
      # degrading the one unreadable card, so this step asserted the old
      # behaviour while the source-overlay step asserted the new one. Every open
      # PR went red and none of them had touched the code.
      - name: Verify registry skcoord contract before source overlay
        run: |
          python -m pip install --force-reinstall --no-deps --no-cache-dir \
            --only-binary=:all: "skcoord==0.1.57"
          python -m pip show skcoord
          python - <<'PY'
          import os
          import tempfile
          from importlib.metadata import version
          from pathlib import Path

          from packaging.version import Version
          from skcoord.card_store import CardCore, CardStore
          from skcoord.cmdb_scheduler import ReconcileLease, ScheduledReconcileConfig
          from skcoord.coordination import Board
          from skcoord.lifecycle import audit_lifecycle, repair_lifecycle, transition_task

          assert Version(version("skcoord")) == Version("0.1.57")
          assert callable(audit_lifecycle)
          assert callable(repair_lifecycle)
          assert callable(transition_task)
          assert ReconcileLease
          assert not ScheduledReconcileConfig().enabled

          os.environ["SKCOORD_CARD_STORE"] = "1"
          with tempfile.TemporaryDirectory() as directory:
              home = Path(directory)
              store = CardStore(home)
              store.create(
                  CardCore(
                      id="registry-contract",
                      title="Registry contract",
                      acceptance_criteria=["birth criterion"],
                  )
              )
              store.append_event(
                  "registry-contract",
                  "amend_criteria",
                  "ci",
                  criteria=["amended criterion"],
              )

              card = store.fold("registry-contract")
              assert card is not None
              assert card.acceptance_criteria == ["amended criterion"]

              view = next(
                  item
                  for item in Board(home).get_task_views()
                  if item.task.id == "registry-contract"
              )
              assert view.task.acceptance_criteria == ["amended criterion"]
          PY
          python -m pytest -q \
            tests/test_cli_kanban.py \
            tests/test_coord_kanban_mcp.py \
            tests/test_coord_amend.py

      # The extracted siblings (CR-4.1/4.3) are declared deps, so the step above
      # already pulls them from PyPI. Reinstall from git main so CI tests the
      # code that ships TOGETHER: a published wheel can lag its repo, and
      # skcapstone's dashboard_*/coordination modules are transparent re-export
      # shims, so a stale sibling silently changes what the shims re-export.
      # --no-deps keeps this from dragging anything over the checkout under test.
      # No @ref on purpose: pip then clones whatever the DEFAULT branch is.
      # Pinning @master broke this job the day those repos were renamed to
      # main, and a CI step that breaks on someone else's rename is a step
      # that will break again.
      # No @ref on purpose: pip then clones whatever the DEFAULT branch is.
      # Pinning @master broke skchat CI the day those repos were renamed to
      # main, with no commit from us in between.
      #
      # skharness is here because tests/test_cli_autopilot_cost.py imports
      # skharness.autocode.autopilot_cost. It was never declared, so CI hit
      # ModuleNotFoundError and those tests reported failure rather than
      # running, while dev boxes (which have it installed) stayed green. It
      # briefly came from PyPI because the repo was private; it is public as of
      # 2026-08-13, so it joins the others and stops being able to lag.
      - name: Install extracted siblings from source
        run: |
          pip install --force-reinstall --no-deps --no-cache-dir \
            "skcoord @ git+https://github.com/smilinTux/skcoord" \
            "skdashboard @ git+https://github.com/smilinTux/skdashboard" \
            "skharness @ git+https://github.com/smilinTux/skharness"

      - name: Run hermetic tests (exclude integration + e2e + network via markers)
        run: |
          python -m pytest tests/ \
            --strict-markers \
            -m "not integration and not e2e and not network" \
            --cov=skcapstone --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  qualification:
    # Qualification lane: runs the full test matrix including integration, e2e,
    # and network-dependent tests. This job requires Docker and other services.
    # It runs only on push to main, not on PRs, and is not required for branch
    # protection. Use the local script for development qualification:
    #   bash scripts/test-qualification.sh
    name: qualification tests (full matrix)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (Docker, libfuse)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse-dev
          # Docker is pre-installed on GitHub Actions runners
          docker info

      - name: Install package with all extras + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Install extracted siblings from source
        run: |
          pip install --force-reinstall --no-deps --no-cache-dir \
            "skcoord @ git+https://github.com/smilinTux/skcoord" \
            "skdashboard @ git+https://github.com/smilinTux/skdashboard" \
            "skharness @ git+https://github.com/smilinTux/skharness"

      - name: Run qualification tests (full matrix)
        run: |
          bash scripts/test-qualification.sh

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-receipt-py${{ matrix.python-version }}
          path: .skcapstone/test-receipt-*.json
          retention-days: 30
