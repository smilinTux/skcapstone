name: pytest

# Pull requests run the complete deterministic suite once on Python 3.12 and
# a focused compatibility lane on Python 3.11. Main, schedule, and reusable
# release calls run the complete advertised Python 3.10 through 3.14 matrix.
# Required check names remain "unit tests (py3.11)" and "unit tests (py3.12)".

on:
  workflow_call:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify test impact
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.impact.outputs.docs_only }}
      base-sha: ${{ steps.range.outputs.base_sha }}
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: range
        name: Resolve audited comparison range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$base^{commit}"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
      - id: impact
        name: Classify documentation-only change
        env:
          DOCS_ONLY_ALLOWED: ${{ github.event_name == 'pull_request' }}
        run: scripts/ci/classify-test-impact.sh "${{ steps.range.outputs.base_sha }}" "$GITHUB_SHA"
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo 'value=["3.11","3.12"]' >> "$GITHUB_OUTPUT"
          else
            echo 'value=["3.10","3.11","3.12","3.13","3.14"]' >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: unit tests (py${{ matrix.python-version }})
    needs: classify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.classify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Record documentation-only decision
        if: github.event_name == 'pull_request' && needs.classify.outputs.docs-only == 'true'
        run: |
          echo "Documentation-only classification verified by scripts/ci/classify-test-impact.sh."
          echo "Python ${{ matrix.python-version }} unit execution intentionally omitted." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: needs.classify.outputs.docs-only != 'true'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system deps (libfuse)
        if: needs.classify.outputs.docs-only != 'true'
        run: |
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
            -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y libfuse-dev
      - name: Install package with all extras and dev tools
        if: needs.classify.outputs.docs-only != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Verify resolved package dependencies
        if: needs.classify.outputs.docs-only != 'true'
        run: python -m pip check
      - name: Verify registry skcoord contract before source overlay
        if: needs.classify.outputs.docs-only != 'true'
        run: |
          python -m pip install --force-reinstall --no-deps --no-cache-dir \
            --only-binary=:all: "skcoord==0.1.69"
          python -m pip show skcoord
          python - <<'PY'
          import os
          import tempfile
          from importlib.metadata import version
          from pathlib import Path

          from packaging.version import Version
          from skcoord.card_store import CardCore, CardStore
          from skcoord.cmdb_scheduler import ReconcileLease, ScheduledReconcileConfig
          from skcoord.coordination import Board
          from skcoord.lifecycle import audit_lifecycle, repair_lifecycle, transition_task

          assert Version(version("skcoord")) == Version("0.1.69")
          assert callable(audit_lifecycle)
          assert callable(repair_lifecycle)
          assert callable(transition_task)
          assert ReconcileLease
          assert not ScheduledReconcileConfig().enabled

          os.environ["SKCOORD_CARD_STORE"] = "1"
          with tempfile.TemporaryDirectory() as directory:
              home = Path(directory)
              store = CardStore(home)
              store.create(
                  CardCore(
                      id="registry-contract",
                      title="Registry contract",
                      acceptance_criteria=["birth criterion"],
                  )
              )
              store.append_event(
                  "registry-contract",
                  "amend_criteria",
                  "ci",
                  criteria=["amended criterion"],
              )
              card = store.fold("registry-contract")
              assert card is not None
              assert card.acceptance_criteria == ["amended criterion"]
              view = next(
                  item
                  for item in Board(home).get_task_views()
                  if item.task.id == "registry-contract"
              )
              assert view.task.acceptance_criteria == ["amended criterion"]
          PY
          python -m pytest -q \
            tests/test_cli_kanban.py \
            tests/test_coord_kanban_mcp.py \
            tests/test_coord_amend.py
      - name: Resolve exact sibling revisions
        if: needs.classify.outputs.docs-only != 'true'
        id: siblings
        run: |
          set -euo pipefail
          dashboard="$(git ls-remote https://github.com/smilinTux/skdashboard HEAD | cut -f1)"
          harness="$(git ls-remote https://github.com/smilinTux/skharness HEAD | cut -f1)"
          [[ "$dashboard" =~ ^[0-9a-f]{40}$ ]]
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]]
          echo "dashboard=$dashboard" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
          printf 'Sibling freshness fence: skdashboard=%s skharness=%s\n' "$dashboard" "$harness"
      - name: Install extracted siblings at exact revisions
        if: needs.classify.outputs.docs-only != 'true'
        env:
          DASHBOARD_SHA: ${{ steps.siblings.outputs.dashboard }}
          HARNESS_SHA: ${{ steps.siblings.outputs.harness }}
        run: |
          pip install --force-reinstall --no-deps --no-cache-dir \
            "skdashboard @ git+https://github.com/smilinTux/skdashboard@${DASHBOARD_SHA}" \
            "skharness @ git+https://github.com/smilinTux/skharness@${HARNESS_SHA}"
      - name: Run complete deterministic unit suite
        if: >-
          needs.classify.outputs.docs-only != 'true' &&
          (github.event_name != 'pull_request' || matrix.python-version == '3.12')
        run: |
          python -m pytest tests/ \
            --strict-markers \
            -m "not integration and not e2e" \
            --cov=skcapstone --cov-report=xml --cov-report=term-missing
      - name: Build and run Python 3.11 compatibility lane
        if: >-
          needs.classify.outputs.docs-only != 'true' &&
          github.event_name == 'pull_request' && matrix.python-version == '3.11'
        env:
          BASE_SHA: ${{ needs.classify.outputs.base-sha }}
        run: scripts/ci/run-python311-compat.sh "$BASE_SHA" "$GITHUB_SHA"
      - name: Upload coverage
        if: >-
          always() && !cancelled() && matrix.python-version == '3.12' &&
          needs.classify.outputs.docs-only != 'true'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
