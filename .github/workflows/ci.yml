name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

# Consistent SKWorld CI pattern (CR-4.6): lint (blocking, this repo is clean) +
# test (clean targeted venv) + build. Companion publish.yml handles tagged releases.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.4
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # This installed with --no-deps to stay a light import smoke. The suite
      # outgrew that: dashboard_kanban imports skcoord at module scope and the
      # queue tests import skcapstone, so pytest errored at COLLECTION and the
      # job has been red on main since 2026-08-13. The kanban, ITIL and queue
      # tests were therefore never actually running.
      #
      # Install the real declared dependencies. Siblings come from PyPI FIRST,
      # then --no-deps -e . puts this checkout on top of whatever skdashboard
      # version they may have pulled in.
      - name: Install dependencies (siblings from PyPI)
        # capauth is REQUIRED here, not optional: the consent-event tests
        # (card 90d23f56) import capauth.authz and capauth.pairing, and the
        # PEPs they cover call a real capauth PDP. Without it the whole
        # module errors at COLLECTION, which reads as a broken gate rather
        # than a failing test. skcoord is pulled in for the ITIL consent
        # store for the same reason.
        run: pip install skcapstone skcoord capauth starlette pytest
      - name: Install skdashboard from the checkout, on top
        run: pip install --no-deps -e .
      - name: Smoke test (package imports, static assets + modules intact)
        run: python -m pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
