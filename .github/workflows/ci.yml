name: CI

# NOTE (coord 62c567cb): the old masked `test` job (pytest with `|| true`)
# was RETIRED from this workflow. The honest, required test check for main
# is .github/workflows/pytest.yml (job `unit`), which runs the full suite
# with all extras and NO masking. Configure branch protection to require
# the pytest.yml `unit` jobs, not anything in this file.
#
# This workflow keeps:
#   - lint: runs black and ruff HONESTLY (no `|| true`). The 2026-07-17 debt
#     (~1019 ruff errors, ~369 files needing black) is now PAID: ruff is clean
#     and black formats everything. Both tools are PINNED, because unpinned
#     they re-red this job on every upstream release with no commit from us in
#     between, which is exactly how it went red again after 2026-08-07.
#   - build: wheel/sdist build + twine check (blocking).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install "black==26.5.1" "ruff==0.15.4"
      - name: Check formatting
        run: black --check src/ tests/
      - name: Lint
        run: ruff check src/

  shim-imports:
    # CR-3.6: blocking gate. The capauth re-export shims
    # (skcapstone.tokens / trust_graph / trust_calibration) were retired;
    # their implementations live in capauth. Any new import of the shim
    # names fails the build. Import from capauth.* directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - name: No retired capauth shim imports
        run: bash scripts/check-no-shim-imports.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Check dist
        run: |
          pip install twine
          twine check dist/*
