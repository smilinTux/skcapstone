name: CI

# NOTE (coord 62c567cb): the old masked `test` job (pytest with `|| true`)
# was RETIRED from this workflow. The honest, required test check for main
# is .github/workflows/pytest.yml (job `unit`), which runs the full suite
# with all extras and NO masking. Configure branch protection to require
# the pytest.yml `unit` jobs, not anything in this file.
#
# This workflow keeps:
#   - lint: runs black and ruff HONESTLY (no `|| true`). The 2026-07-17 debt
#     (~1019 ruff errors, ~369 files needing black) is now PAID: ruff is clean
#     and black formats everything. Both tools are PINNED, because unpinned
#     they re-red this job on every upstream release with no commit from us in
#     between, which is exactly how it went red again after 2026-08-07.
#   - build: wheel/sdist build + twine check (blocking).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # merge_group: prerequisite for a GitHub merge queue (not yet enabled).
  # No step here reads pull_request/PR-number context (checkout, black,
  # ruff, the shim-import checks, and the wheel/sdist build all operate on
  # the checked-out tree only), so this job needs no other change to behave
  # correctly under merge_group.
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install "black==26.5.1" "ruff==0.15.4"
      - name: Check formatting
        run: black --check src/ tests/
      - name: Lint
        run: ruff check src/

  shim-imports:
    # CR-3.6: blocking gate. The capauth re-export shims
    # (skcapstone.tokens / trust_graph / trust_calibration) were retired;
    # their implementations live in capauth. Any new import of the shim
    # names fails the build. Import from capauth.* directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - name: No retired capauth shim imports
        run: bash scripts/check-no-shim-imports.sh
      - name: No raw CardStore write instructions
        run: python scripts/check-coord-write-guidance.py
      # Does every workflow ref actually resolve? This job is the right host
      # for the question because it has NO cross-repo `uses:` of its own, so
      # it still runs when a cross-repo ref is broken. The gate it protects
      # (docs / docs-check) cannot check its own ref: a workflow whose `uses:`
      # will not resolve dies before creating a job and publishes no check run
      # at all, so it goes ABSENT rather than red. That happened twice on
      # 2026-09-19. Exit 2 (could not reach the API) fails this step on
      # purpose: "I could not look" must never render as "I looked".
      - name: Workflow refs resolve
        run: python scripts/ci/workflow_refs.py --resolve
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Check dist
        run: |
          pip install twine
          twine check dist/*
