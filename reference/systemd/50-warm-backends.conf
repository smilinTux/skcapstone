# Warm every routed backend after the gateway starts.
#
# Two fail-closed gates both key on "has this backend been observed", and
# neither can establish that on its own. skgateway router.mjs isAvailable()
# returns false while _lastCheck === 0, and _lastCheck is only set by
# recordOutcome() AFTER a request completes. skcapstone lane_health() is
# fail-closed on state "unknown", and a backend is unknown until the gateway
# has observed it. So every gateway restart blocked the whole fleet's lane
# admission until something happened to send real traffic.
#
# Measured on chi 2026-09-18: a restart reset codex and zai to observed=false
# and lane admission refused every card. Earlier the same day, the same class
# of fail-closed block cost three days of zero dispatch by another path.
#
# Deliberately NOT ExecStartPre: the gateway has to be listening first.
# Deliberately non-fatal (|| true): one provider being down must never stop the
# gateway from serving every other lane.
[Service]
ExecStartPost=/bin/bash -lc "sleep 3; %h/.local/bin/skgw-warm || true"
