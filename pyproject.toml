[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "skdashboard"
dynamic = ["version"]
description = "SKWorld operator dashboard — coord board + ITIL + kanban + CMDB web UI/API (:7778)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [{name = "smilinTux", email = "admin@smilintux.org"}]
keywords = ["ai", "agent", "sovereign", "dashboard", "kanban", "itil"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "capauth>=0.3.8",
    "cryptography>=42",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "mcp>=1.0,<2.0",
    "PyJWT[crypto]>=2.8",
    "referencing>=0.35",
    "skcoord>=0.1.40",
    "skcapstone>=0.15.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
skdashboard-read-only = "skdashboard.read_only:main"
skdashboard-control-plane-mcp = "skdashboard.control_plane_mcp:main"


[project.urls]
Homepage = "https://github.com/smilinTux/skdashboard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skdashboard = ["static/**/*", "contracts/**/*.json", "*.html"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools_scm]
# The git tag IS the version. A push to the default branch cuts the next
# patch tag (see .github/workflows/publish.yml), so every release carries a
# genuinely new version instead of rebuilding 0.1.0 forever.
#
# These repos also carry NON-semver tags (swarm-20260717, fixwave-20260723,
# memory-index-fix-20260804, nextcloud-v0.3.0). setuptools-scm defaults to the
# newest tag of ANY shape, which derived a nonsense version like
# 20260805.dev25 for skcapstone. Both settings below restrict it to release
# tags only, matching the `--match 'v[0-9]*'` the tag job uses, so the two
# cannot disagree about which tag is current.
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
