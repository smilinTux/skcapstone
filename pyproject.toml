[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skdashboard"
version = "0.1.0"
description = "SKWorld operator dashboard — coord board + ITIL + kanban + CMDB web UI/API (:7778)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [{name = "smilinTux", email = "admin@smilintux.org"}]
keywords = ["ai", "agent", "sovereign", "dashboard", "kanban", "itil"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "skcoord>=0.1.0",
    "skcapstone>=0.15.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]


[project.urls]
Homepage = "https://github.com/smilinTux/skdashboard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skdashboard = ["static/**/*", "*.html"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
