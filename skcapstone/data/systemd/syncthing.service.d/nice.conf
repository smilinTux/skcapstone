# syncthing.service.d/nice.conf — Syncthing desktop-tuning drop-in.
#
# Keeps the mesh's continuous sync (skcapstone/skcomms status, heartbeats,
# agent memories) courteous to whatever you are actively doing: low CPU share,
# low IO share and idle disk scheduling, so a rescan/sync storm can never
# freeze the GUI thread again. Sync stays fully functional, just deprioritised.
#
# Installed automatically by scripts/install.sh (idempotent). To apply manually:
#
#   mkdir -p ~/.config/systemd/user/syncthing.service.d
#   cp systemd/syncthing.service.d/nice.conf ~/.config/systemd/user/syncthing.service.d/
#   systemctl --user daemon-reload
#   systemctl --user restart syncthing.service
#
# Verify: systemctl --user show syncthing -p Nice -p CPUWeight -p IOSchedulingClass
[Service]
Nice=15
CPUWeight=20
IOWeight=20
IOSchedulingClass=idle